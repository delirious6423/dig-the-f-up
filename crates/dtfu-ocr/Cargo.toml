[package]
name = "dtfu-ocr"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "6"
dtfu-llama-sys = { path = "../dtfu-llama-sys", optional = true }
dtfu-models = { path = "../dtfu-models", optional = true }

# ocrs (pure Rust OCR) backend: always compiled off macOS; on macOS only with
# `--features ocrs` (Apple Vision remains the default there).
[features]
ocrs = ["dep:ocrs", "dep:rten"]
# LightOnOCR-3-0.8B through the vendored llama.cpp (needs build-llama; see docs/BENCHMARKS.md, OCR).
lighton = ["dep:dtfu-llama-sys", "dep:dtfu-models"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
rten = { version = "0.26", default-features = false, features = ["rten_format"] }

[target.'cfg(target_os = "macos")'.dependencies]
ocrs = { version = "0.13.1", default-features = false, features = ["rten"], optional = true }
rten = { version = "0.26", default-features = false, features = ["rten_format"], optional = true }
objc2 = "0.6.5"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"

[dev-dependencies]
ab_glyph = "0.2.32"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[[example]]
name = "lighton_probe"
required-features = ["lighton"]
