[package]
name = "dtfu-extract-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
unicode-normalization = "0.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "thread_safe", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "thread_safe", "sync"], optional = true }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSValue", "NSGeometry"] }
objc2-core-graphics = { version = "0.3", features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGGeometry", "CGImage"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage", "PDFKitPlatform"] }
objc2-core-foundation = "0.3"

[features]
# macOS only: also compile the pdfium backend (`pdfium::PdfDoc`) next to PDFKit, for testing.
pdfium = ["dep:pdfium-render"]
