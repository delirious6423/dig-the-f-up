[package]
name = "dtfu-index"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["llama"]
# Implements `Embed` for the real llama.cpp embedder. Off for fast tests with a fake embedder.
llama = ["dep:dtfu-embed"]
# Kept for old build commands: LightOnOCR-3 is now on by default (dtfu-ocr default feature).
lighton = ["dtfu-ocr/lighton"]

[dependencies]
anyhow.workspace = true
rayon.workspace = true
dtfu-core.workspace = true
dtfu-crawl = { path = "../dtfu-crawl" }
dtfu-store = { path = "../dtfu-store" }
dtfu-extract-text = { path = "../dtfu-extract-text" }
dtfu-extract-image = { path = "../dtfu-extract-image" }
dtfu-extract-audio = { path = "../dtfu-extract-audio" }
dtfu-extract-pdf = { path = "../dtfu-extract-pdf" }
dtfu-extract-video = { path = "../dtfu-extract-video" }
dtfu-ocr = { path = "../dtfu-ocr" }
dtfu-embed = { path = "../dtfu-embed", optional = true }
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
