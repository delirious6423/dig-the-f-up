[package]
name = "digup-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "digup"
path = "src/main.rs"

[features]
# Lets `DIGUP_OCR=lighton` select the LightOnOCR-3 engine during indexing.
lighton = ["digup-index/lighton"]

[dependencies]
anyhow = { workspace = true }
digup-core = { workspace = true }
digup-crawl = { path = "../digup-crawl" }
digup-embed = { path = "../digup-embed" }
digup-engine = { path = "../digup-engine" }
digup-mcp = { path = "../digup-mcp" }
digup-extract-pdf = { path = "../digup-extract-pdf" }
digup-extract-video = { path = "../digup-extract-video" }
digup-models = { path = "../digup-models" }
digup-index = { path = "../digup-index" }
digup-search = { path = "../digup-search" }
digup-store = { path = "../digup-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
