[package]
name = "dtfu-crawl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parallel filesystem crawler, file classification and folder-selection rules (port of DigUpKit Crawler/Rules/FolderSelection)"

[dependencies]
rayon = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
