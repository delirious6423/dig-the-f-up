[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
half = "2"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
tempfile = "3"
digup-core = { path = "crates/digup-core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
